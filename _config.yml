# Site settings for Learn shader art.
#
# Jekyll does not reload this file while `jekyll serve` is running. Restart the
# preview after editing it.

title: Learn shader art
description: "A zero-to-hero course in shader art: GLSL, signed distance fields, noise, raymarching, and shaders you can perform"
baseurl: "/shader-learn" # provisional; hosting is deferred (see README)
url: "https://www.edumeneses.com" # review deployment; hosting is deferred (see README)

permalink: pretty

exclude:
  [
    ".vscode",
    ".bundle",
    ".venv",
    "vendor",
    "node_modules/",
    "*.gemspec",
    "*.gem",
    "Gemfile",
    "Gemfile.lock",
    "package.json",
    "package-lock.json",
    "script/",
    "lib/",
    "bin/",
    "README.md",
    "CLAUDE.md",
    "HANDOVER.md",
    "Rakefile",
    "Dockerfile",
    "docker-compose.yml",
    ".github",
    "*.sh",
    "CODE_OF_CONDUCT.md",
    "checks/",
    "scripts/",
    "figures/",
    "LICENSE",
    "LICENSE-theme.txt",
    "backups",
    "*.backupclaude",
  ]

logo: "/assets/images/shader-learn-logo.svg"

# The name beside the mark in the sidebar. Read by _includes/title.html, which
# had "ossia" hardcoded when it arrived from the score course's vendored theme.
wordmark: "shader art"

search_enabled: true
search:
  heading_level: 2
  previews: 2
  preview_words_before: 3
  preview_words_after: 3
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

heading_anchors: true

nav_sort: case_sensitive

back_to_top: true
back_to_top_text: "Back to top"

footer_content: 'Lesson text, figures, and shader sources are licensed <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a>. <em>ossia score</em> is a project of <a href="https://ossia.io">ossia.io</a>. ISF is a format by <a href="https://isf.video">Vidvox</a>.'

last_edit_timestamp: true
last_edit_time_format: "%b %e %Y at %I:%M %p"

gh_edit_link: true
gh_edit_link_text: "Edit this page on GitHub"
gh_edit_repository: "https://github.com/edumeneses/shader-learn"
gh_edit_branch: "main"
gh_edit_view_mode: "tree"

color_scheme: shaderlearn

plugins:
  - jekyll-seo-tag
  - jekyll-wikirefs

markdown: kramdown
kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

wikirefs:
  attributes:
    enabled: true
  case: "none"
  css:
    exclude: []
    name:
      typed: "typed"
      wiki: "wiki-link"
      web: "web-link"
      invalid_wiki: "invalid-wiki-link"
      embed_container: "embed-container"
      embed_title: "embed-title"
      embed_content: "embed-content"
      embed_link: "embed-wiki-link"
      embed_image_container: "embed-image-container"
      embed_image: "embed-image"
  enabled: true
  exclude: []

# Where a unit's own media lives, and where the shader library lives. Both are
# absolute because the site is served from a subdirectory; _local_config.yml
# empties them for the local preview.
img: "/shader-learn/docs/learn/assets"
shaders: "/shader-learn/docs/learn/assets/shaders"
library: "/shader-learn/library"

# While true, every page carries a robots noindex tag: see _includes/head.html.
# Set to false to let search engines in.
noindex: true

# The pinned ossia score build. Every unit that touches score declares it too,
# and scripts/check_units.py fails on a mismatch, so a screenshot cannot
# silently belong to a different release.
score_version: "3.8.2"

# The GLSL dialect every shader in this course is written to compile as. It is
# what WebGL 2 accepts and what ossia score's ISF pipeline produces, which is
# the whole reason a shader from a lesson runs unchanged in both.
glsl_version: "GLSL ES 3.00"

# Base of the reference documentation the course links into.
docs_baseurl: "https://ossia.io/score-docs"
isf_baseurl: "https://isf.video"
