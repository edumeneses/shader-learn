# Single source of truth for the course's unit numbering and slugs.
#
# Slugs become published permalinks (/learn/<slug>.html) and future videos will
# point at them, so a slug is CONTRACTUAL once `written: true`. Renaming a
# written unit is a breaking change; add a new number or a Part II instead.
# scripts/check_units.py validates every unit page and every internal link
# against this file.
#
# kind:      lesson | milestone | capstone
# read:      minutes of prose
# practice:  minutes at the keyboard; 0 means none
# score:     true when the unit needs ossia score installed
# written:   true once the page exists under docs/learn/

