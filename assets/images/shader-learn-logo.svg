<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" role="img" aria-label="Learn shader art">
  <defs>
    <linearGradient id="sl-g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46e0d4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- A fragment grid with one fragment lit: the whole course in one mark. -->
  <g fill="none" stroke="#38404f" stroke-width="1.5">
    <rect x="6"  y="10" width="9" height="9" rx="1"/>
    <rect x="17" y="10" width="9" height="9" rx="1"/>
    <rect x="28" y="10" width="9" height="9" rx="1"/>
    <rect x="6"  y="21" width="9" height="9" rx="1"/>
    <rect x="28" y="21" width="9" height="9" rx="1"/>
    <rect x="6"  y="32" width="9" height="9" rx="1"/>
    <rect x="17" y="32" width="9" height="9" rx="1"/>
    <rect x="28" y="32" width="9" height="9" rx="1"/>
  </g>
  <rect x="17" y="21" width="9" height="9" rx="1" fill="url(#sl-g)"/>
  <text x="50" y="24" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#f2f5fa">Learn</text>
  <text x="50" y="40" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="600" fill="url(#sl-g)">shader art</text>
</svg>
