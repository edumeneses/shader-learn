<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Learn shader art">
  <defs>
    <linearGradient id="sl-frag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#46e0d4"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <!-- A fragment grid with one fragment lit: a shader is a program per pixel,
       and the mark is the smallest way to say that. -->
  <g fill="none" stroke="#5b6577" stroke-width="1.6">
    <rect x="5"  y="5"  width="11" height="11" rx="1.5"/>
    <rect x="18.5" y="5"  width="11" height="11" rx="1.5"/>
    <rect x="32" y="5"  width="11" height="11" rx="1.5"/>
    <rect x="5"  y="18.5" width="11" height="11" rx="1.5"/>
    <rect x="32" y="18.5" width="11" height="11" rx="1.5"/>
    <rect x="5"  y="32" width="11" height="11" rx="1.5"/>
    <rect x="18.5" y="32" width="11" height="11" rx="1.5"/>
    <rect x="32" y="32" width="11" height="11" rx="1.5"/>
  </g>
  <rect x="18.5" y="18.5" width="11" height="11" rx="1.5" fill="url(#sl-frag)"/>
</svg>
